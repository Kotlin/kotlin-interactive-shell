name: Java CI

on: [push, pull_request]  

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 25]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Check for K1 REPL leftovers
        shell: bash
        run: |
          if git grep -n -E 'ide_services|BasicJvmReplEvaluator|KJvmReplCompilerWithIdeServices' -- ki-shell ki-completion-plugin; then
            echo "K1 REPL API usages found"
            exit 1
          fi
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
      - name: Smoke test the launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo 'println(listOf(1, 2).sum())' > smoke.kts
          test "$(bin/ki -f smoke.kts)" = 3
      - name: Smoke test the Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo println(listOf(1, 2).sum()) > smoke.kts
          call bin\ki.bat -f smoke.kts | findstr /x 3
